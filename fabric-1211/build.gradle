plugins { id 'fabric-loom' version '1.11.8' }

base { archivesName = 'worldgennext-fabric-1.21.1' }

// The mod's code is the same on every loader and lives in the NeoForge module; only the two classes in
// dev.worldgennext.neoforge.loader and the loader metadata differ.
def pureModules = ['semantic-core', 'compiler-jvm', 'compiler-vulkan', 'material-codec', 'spatial-data', 'chunk-engine', 'frontend-mc1211', 'runtime-vulkan']
def shared = project(':neoforge-1211').projectDir

dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.17+1.21.1'
    implementation project(':compiler-vulkan')
}

sourceSets.main {
    java {
        srcDir new File(shared, 'src/main/java')
        exclude { element -> element.file.toPath().startsWith(shared.toPath()) && element.path in ['dev/worldgennext/neoforge/loader/Loader.java', 'dev/worldgennext/neoforge/loader/NeoForgeEntry.java'] }
    }
    resources {
        srcDir new File(shared, 'src/main/resources')
        exclude 'META-INF/neoforge.mods.toml'
    }
}

tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.named('jar', Jar) {
    pureModules.each { from project(":$it").sourceSets.main.output }
    duplicatesStrategy = DuplicatesStrategy.FAIL
}
tasks.named('sourcesJar', Jar) {
    pureModules.each { from project(":$it").sourceSets.main.allSource }
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

loom {
    accessWidenerPath = file('src/main/resources/worldgennext.accesswidener')
    runs {
        configureEach {
            // Same switches as the NeoForge dev runs: every -Dworldgennext.* given to Gradle reaches the game.
            System.properties.each { key, value ->
                if (key.toString().startsWith('worldgennext.') && !(key.toString() in ['worldgennext.candidate.runDir', 'worldgennext.run.maxHeap', 'worldgennext.run.jvmArgs'])) {
                    // Relative output paths are resolved here: the game's working directory is the run directory.
                    property key.toString(), key == 'worldgennext.bench.output' && !value.toString().trim().isEmpty() ? project.file(value.toString().trim()).absolutePath : value.toString()
                }
            }
            def maxHeap = System.getProperty('worldgennext.run.maxHeap', '').trim()
            if (!maxHeap.isEmpty()) vmArg "-Xmx${maxHeap}"
            vmArg '-Dorg.lwjgl.system.stackSize=16384'
            def directory = System.getProperty('worldgennext.candidate.runDir', '').trim()
            if (!directory.isEmpty()) runDir = project.projectDir.toPath().relativize(new File(directory).toPath()).toString().replace(File.separator, '/')
        }
        server { programArg 'nogui' }
        client {
            // Straight into an existing singleplayer world (a folder under <run directory>/saves).
            def quickPlay = System.getProperty('worldgennext.client.quickPlay', '').trim()
            if (!quickPlay.isEmpty()) programArgs '--quickPlaySingleplayer', quickPlay
        }
    }
}

apply from: rootProject.file('gradle/gpu-runtime.gradle')

// ---- Names for a released game -----------------------------------------------
// The mod reads parts of the world generator by reflection, by the names its source uses.  A released Fabric
// game runs with other ("intermediary") names.  This writes the pairs for the names that occur as string
// literals in the mod's source, and only those, from the mappings this build uses; loader/Loader reads it.
def nameTableDir = layout.buildDirectory.dir('generated/nameTable')
tasks.register('generateNameTable') {
    def sources = fileTree(new File(shared, 'src/main/java')) { include '**/*.java' } + fileTree('src/main/java') { include '**/*.java' }
    inputs.files(sources)
    outputs.dir(nameTableDir)
    doLast {
        def tokens = new HashSet<String>()
        sources.each { source -> (source.getText('UTF-8') =~ /"([A-Za-z_$][A-Za-z0-9_$]*)"/).each { tokens.add(it[1]) } }
        def mappings = loom.mappingConfiguration.tinyMappings.toFile()
        def header = mappings.withReader('UTF-8') { it.readLine() }.split('\t')
        def intermediary = header.findIndexOf { it == 'intermediary' } - 3
        def named = header.findIndexOf { it == 'named' } - 3
        if (header[0] != 'tiny' || intermediary < 0 || named < 0) throw new GradleException("Unexpected mappings header in ${mappings}")
        def table = new StringBuilder()
        String classRuntime = null
        boolean minecraft = false
        mappings.eachLine('UTF-8') { line ->
            def part = line.split('\t', -1)
            if (part[0] == 'c') {
                classRuntime = part[1 + intermediary]
                def source = part[1 + named]
                minecraft = source.startsWith('net/minecraft/') || source.startsWith('com/mojang/')
                def simple = source.substring(Math.max(source.lastIndexOf('/'), source.lastIndexOf('$')) + 1)
                if (minecraft && tokens.contains(simple)) table << "c\t${classRuntime}\t${source}\n"
            } else if (minecraft && part.length >= 5 && part[0] == '' && (part[1] == 'f' || part[1] == 'm')) {
                def runtime = part[3 + intermediary], source = part[3 + named]
                if (runtime != source && tokens.contains(source)) table << "${part[1]}\t${classRuntime}\t${source}\t${runtime}\n"
            }
        }
        def file = nameTableDir.get().file('worldgennext/fabric-names.tsv').asFile
        file.parentFile.mkdirs()
        file.setText(table.toString(), 'UTF-8')
    }
}
sourceSets.main.resources.srcDir(nameTableDir)
tasks.named('processResources') { dependsOn 'generateNameTable' }
tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn 'generateNameTable'; exclude 'worldgennext/fabric-names.tsv' }

// The dev server's run directory, as in the NeoForge module (scripts/run-pregen.sh, bench-cps.ps1).
tasks.register('prepareCandidateRun') {
    doLast {
        def directory = project.file(System.getProperty('worldgennext.candidate.runDir', layout.buildDirectory.dir('run/candidate').get().asFile.absolutePath))
        if (Boolean.parseBoolean(System.getProperty('worldgennext.prototype.resume', 'false'))) return
        directory.mkdirs()
        new File(directory, 'eula.txt').text = 'eula=true\n'
        def seed = System.getProperty('worldgennext.candidate.seed', '0')
        new File(directory, 'server.properties').text = "level-seed=${seed}\nlevel-name=candidate-world\ngenerate-structures=${System.getProperty('worldgennext.run.generateStructures', 'true')}\nsync-chunk-writes=${System.getProperty('worldgennext.run.syncChunkWrites', 'true')}\nonline-mode=false\nserver-ip=127.0.0.1\nserver-port=${System.getProperty('worldgennext.prototype.port', '25565')}\nspawn-protection=0\nmax-tick-time=-1\nenable-command-block=true\n"
    }
}
tasks.matching { it.name == 'runServer' || it.name == 'runClient' }.configureEach { dependsOn tasks.named('prepareCandidateRun') }
