pluginManagement { repositories { gradlePluginPortal(); maven { url = 'https://maven.neoforged.net/releases' }; maven { url = 'https://maven.fabricmc.net/' } } }
// Source distributions need these files. Gradle requires default-exclude changes in settings.
org.apache.tools.ant.DirectoryScanner.removeDefaultExclude('**/.gitignore')
org.apache.tools.ant.DirectoryScanner.removeDefaultExclude('**/.gitattributes')
rootProject.name = 'tellurium'
include 'semantic-core', 'compiler-jvm', 'compiler-vulkan', 'material-codec', 'spatial-data', 'chunk-engine', 'frontend-mc1211', 'runtime-vulkan', 'oracle-and-replay', 'oracle-1211'
// The builds of the mod, one Gradle project per entry of mod/targets.gradle.  A target's folder holds only
// its build output; its build script is the one of its loader.
apply from: 'mod/targets.gradle'
gradle.ext.modTargets.each { name, target ->
    include name
    def directory = file("mod/targets/$name")
    directory.mkdirs()
    project(":$name").projectDir = directory
    project(":$name").buildFileName = "../../${target.loader}.gradle"
}
