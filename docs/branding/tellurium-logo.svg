<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 112 112" role="img" aria-labelledby="title desc">
  <title id="title">Tellurium</title>
  <desc id="desc">A GPU chip whose dark face reads Te 52 above blocky grass, dirt and stone terrain.</desc>

  <!-- Pins are 6 units wide; terrain steps are 3 high and land on pin edges. -->

  <defs>
    <clipPath id="face">
      <rect x="24" y="24" width="64" height="64" rx="8"/>
    </clipPath>
  </defs>

  <!-- Tile -->
  <rect width="112" height="112" rx="20" fill="#14162B"/>

  <!-- Chip pins -->
  <g fill="#8B93B8">
    <rect x="30" y="12" width="6" height="12"/>
    <rect x="53" y="12" width="6" height="12"/>
    <rect x="76" y="12" width="6" height="12"/>
    <rect x="30" y="88" width="6" height="12"/>
    <rect x="53" y="88" width="6" height="12"/>
    <rect x="76" y="88" width="6" height="12"/>
    <rect x="12" y="30" width="12" height="6"/>
    <rect x="12" y="53" width="12" height="6"/>
    <rect x="12" y="76" width="12" height="6"/>
    <rect x="88" y="30" width="12" height="6"/>
    <rect x="88" y="53" width="12" height="6"/>
    <rect x="88" y="76" width="12" height="6"/>
  </g>

  <!-- Chip face -->
  <rect x="24" y="24" width="64" height="64" rx="8" fill="#2A3060"/>

  <!-- Terrain: stone, dirt (level with the lowest side pins), grass -->
  <g clip-path="url(#face)">
    <rect x="24" y="82" width="64" height="6" fill="#6B7280"/>
    <rect x="24" y="76" width="64" height="6" fill="#C8782E"/>
    <polygon points="24,76 24,73 30,73 30,70 53,70 53,73 59,73 59,70 76,70 76,67 88,67 88,76" fill="#5BD15B"/>
  </g>

