<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 112 112" role="img" aria-labelledby="title desc">
  <title id="title">Tellurium</title>
  <desc id="desc">A GPU chip whose dark face reads Te 52 above blocky grass, dirt and stone terrain.</desc>

  <!-- Tile -->
  <rect width="112" height="112" rx="20" fill="#14162B"/>

  <!-- Chip pins -->
  <g fill="#8B93B8">
    <rect x="34" y="14" width="6" height="10"/>
    <rect x="53" y="14" width="6" height="10"/>
    <rect x="72" y="14" width="6" height="10"/>
    <rect x="34" y="88" width="6" height="10"/>
    <rect x="53" y="88" width="6" height="10"/>
    <rect x="72" y="88" width="6" height="10"/>
    <rect x="14" y="34" width="10" height="6"/>
    <rect x="14" y="53" width="10" height="6"/>
    <rect x="14" y="72" width="10" height="6"/>
    <rect x="88" y="34" width="10" height="6"/>
    <rect x="88" y="53" width="10" height="6"/>
    <rect x="88" y="72" width="10" height="6"/>
  </g>

  <!-- Chip face -->
  <rect x="24" y="24" width="64" height="64" rx="8" fill="#2A3060"/>

  <!-- Terrain: stone, dirt, grass -->
  <path d="M24 80 L88 80 Q88 88 80 88 L32 88 Q24 88 24 80 Z" fill="#6B7280"/>
  <rect x="24" y="74" width="64" height="6" fill="#C8782E"/>
  <polygon points="24,74 24,70 34,70 34,64 46,64 46,70 60,70 60,66 74,66 74,62 88,62 88,74" fill="#5BD15B"/>

  <!-- Element cell -->
  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="600">
    <text x="30" y="36" font-size="10" fill="#FFD54F">52</text>
    <text x="56" y="59" font-size="26" text-anchor="middle" fill="#FFFFFF">Te</text>
  </g>
</svg>
