plugins { id 'net.neoforged.moddev' version '2.0.91' }

base { archivesName = 'worldgennext-neoforge-1.21.1' }

def pureModules = ['semantic-core', 'compiler-jvm', 'compiler-vulkan', 'material-codec', 'spatial-data', 'chunk-engine', 'frontend-mc1211', 'runtime-vulkan']

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}
dependencies { pureModules.each { gameTestImplementation project(":$it") } }

neoForge {
    version = '21.1.176'
    addModdingDependenciesTo(sourceSets.gameTest)
    mods {
        worldgennext {
            sourceSet sourceSets.main
            pureModules.each { sourceSet project(":$it").sourceSets.main }
        }
        worldgennext_test { sourceSet sourceSets.gameTest }
    }
    runs {
        server {
            server()
            loadedMods = [mods.worldgennext]
            gameDirectory = project.file(System.getProperty('worldgennext.candidate.runDir', layout.buildDirectory.dir('run/server').get().asFile.absolutePath))
            // The mod source set intentionally keeps Vulkan implementation
            // dependencies out of the production jar.  Inject only the
            // launch-time LWJGL artifacts so diagnostic GPU candidate runs
            // can resolve the executor without exposing bundled project
            // modules a second time through ModLauncher's module path.
            additionalRuntimeClasspathConfiguration.dependencies.add module('org.lwjgl:lwjgl:3.3.3')
            additionalRuntimeClasspathConfiguration.dependencies.add module('org.lwjgl:lwjgl-vulkan:3.3.3')
            additionalRuntimeClasspathConfiguration.dependencies.add module('org.lwjgl:lwjgl-shaderc:3.3.3')
            additionalRuntimeClasspathConfiguration.dependencies.add module('org.lwjgl:lwjgl:3.3.3:natives-windows')
            additionalRuntimeClasspathConfiguration.dependencies.add module('org.lwjgl:lwjgl-shaderc:3.3.3:natives-windows')
            def lwjglStackSize = System.getProperty('worldgennext.lwjgl.stackSize', '16384').trim()
            if (!(lwjglStackSize ==~ /[1-9][0-9]*/)) {
                throw new GradleException('worldgennext.lwjgl.stackSize must be a positive decimal stack-size value')
            }
            jvmArgument "-Dorg.lwjgl.system.stackSize=${lwjglStackSize}"
            programArgument '--nogui'
        }
        client {
            client()
            loadedMods = [mods.worldgennext]
            gameDirectory = project.file(System.getProperty('worldgennext.candidate.runDir', layout.buildDirectory.dir('run/client').get().asFile.absolutePath))
            // Straight into an existing singleplayer world (a folder under <gameDirectory>/saves).
            def quickPlay = System.getProperty('worldgennext.client.quickPlay', '').trim()
            if (!quickPlay.isEmpty()) programArguments.addAll '--quickPlaySingleplayer', quickPlay
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            loadedMods = [mods.worldgennext, mods.worldgennext_test]
            gameDirectory = layout.buildDirectory.dir('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'worldgennext_test'
            systemProperty 'neoforge.gameTestServer', 'true'
            programArguments.addAll '--world', 'worldgennext-diagnostics'
        }
    }
}

tasks.named('jar', Jar) {
    pureModules.each { from project(":$it").sourceSets.main.output }
    duplicatesStrategy = DuplicatesStrategy.FAIL
    manifest { attributes('Implementation-Title': 'WorldgenNext diagnostics', 'Implementation-Version': project.version) }
}
tasks.named('sourcesJar', Jar) {
    pureModules.each { from project(":$it").sourceSets.main.allSource }
    duplicatesStrategy = DuplicatesStrategy.FAIL
}
tasks.register('gameSmoke') {
    group = 'verification'
    description = 'Opt-in real NeoForge bootstrap, mapped capture and direct-density diagnostic GameTests; no chunk/GPU parity claim.'
    dependsOn tasks.named('runGameTestServer')
}

tasks.register('prepareCandidateRun') {
    doLast {
        def directory = project.file(System.getProperty('worldgennext.candidate.runDir', layout.buildDirectory.dir('run/candidate').get().asFile.absolutePath))
        def seed = System.getProperty('worldgennext.candidate.seed', '0')
        if (Boolean.parseBoolean(System.getProperty('worldgennext.prototype.resume', 'false'))) {
            if (!new File(directory, 'server.properties').isFile() || !new File(directory, 'candidate-world/level.dat').isFile()) {
                throw new GradleException('Prototype resume requires an existing candidate-world and server.properties')
            }
            return
        }
        directory.mkdirs()
        new File(directory, 'eula.txt').text = 'eula=true\n'
        def port = Integer.parseInt(System.getProperty('worldgennext.prototype.port', '25565'))
        if (port < 1 || port > 65535) throw new GradleException('Prototype port must be between 1 and 65535')
        new File(directory, 'server.properties').text = "level-seed=${seed}\nlevel-name=candidate-world\nlevel-type=minecraft\\:normal\ngenerate-structures=${System.getProperty('worldgennext.run.generateStructures', 'true')}\nsync-chunk-writes=${System.getProperty('worldgennext.run.syncChunkWrites', 'true')}\nonline-mode=false\nserver-ip=127.0.0.1\nserver-port=${port}\nspawn-protection=0\nmax-tick-time=-1\nenable-command-block=true\n"
    }
}

tasks.matching { it.name == 'runServer' || it.name == 'runClient' }.configureEach {
    dependsOn tasks.named('prepareCandidateRun')
    if (Boolean.parseBoolean(System.getProperty('worldgennext.prototype.cpuLive', 'false'))) {
        standardInput = System.in
    }
    // Throughput benchmark settings are forwarded verbatim (output resolved at the Gradle boundary).
    System.properties.each { key, value ->
        if (['worldgennext.bench.', 'worldgennext.pregen.', 'worldgennext.status', 'worldgennext.dh.', 'worldgennext.parallel', 'worldgennext.fast.', 'worldgennext.async', 'worldgennext.biome',
             'worldgennext.unload', 'worldgennext.noiseChunk', 'worldgennext.promptTask', 'worldgennext.region'].any { key.toString().startsWith(it) }) {
            def forwarded = key == 'worldgennext.bench.output' && !value.toString().trim().isEmpty()
                    ? project.file(value.toString().trim()).absolutePath : value.toString()
            systemProperty key.toString(), forwarded
        }
    }
    def maxHeap = System.getProperty('worldgennext.run.maxHeap', '').trim()
    if (!maxHeap.isEmpty()) jvmArgs "-Xmx${maxHeap}"
    def extraJvmArgs = System.getProperty('worldgennext.run.jvmArgs', '').trim()
    if (!extraJvmArgs.isEmpty()) jvmArgs extraJvmArgs.split(/\s+/)
    def jfr = System.getProperty('worldgennext.run.jfr', '').trim()
    if (!jfr.isEmpty()) { def jfrFile = rootProject.file(jfr); jfrFile.parentFile.mkdirs(); jvmArgs "-XX:StartFlightRecording=filename=${jfrFile.absolutePath},settings=profile,dumponexit=true" }
    systemProperty 'worldgennext.candidate.capture', System.getProperty('worldgennext.candidate.capture', 'false')
    def candidateOutput = System.getProperty('worldgennext.candidate.output', '').trim()
    // runServer changes the JVM working directory to the game directory.
    // Resolve the artifact at the Gradle boundary so a relative CLI path
    // cannot silently become <runDir>/build/... inside the server process.
    systemProperty 'worldgennext.candidate.output', candidateOutput.isEmpty() ? '' : project.file(candidateOutput).absolutePath
    def candidateCaseFile = System.getProperty('worldgennext.candidate.caseFile', '').trim()
    systemProperty 'worldgennext.candidate.caseFile', candidateCaseFile.isEmpty() ? '' : project.file(candidateCaseFile).absolutePath
    systemProperty 'worldgennext.candidate.chunkX', System.getProperty('worldgennext.candidate.chunkX', '0')
    systemProperty 'worldgennext.candidate.chunkZ', System.getProperty('worldgennext.candidate.chunkZ', '0')
    systemProperty 'worldgennext.candidate.dimension', System.getProperty('worldgennext.candidate.dimension', 'minecraft:overworld')
    systemProperty 'worldgennext.candidate.endpoint', System.getProperty('worldgennext.candidate.endpoint', 'NOISE')
    systemProperty 'worldgennext.candidate.live', System.getProperty('worldgennext.candidate.live', 'false')
    def logicalBackend = System.getProperty('worldgennext.candidate.logicalBackend', 'CPU_OWNED')
    if (!(logicalBackend in ['CPU_OWNED', 'GPU_IEEE_BITS'])) {
        throw new GradleException('candidate.logicalBackend must be CPU_OWNED or GPU_IEEE_BITS')
    }
    systemProperty 'worldgennext.candidate.logicalBackend', logicalBackend
    systemProperty 'worldgennext.prototype.cpuLive', System.getProperty('worldgennext.prototype.cpuLive', 'false')
    systemProperty 'worldgennext.prototype.cpuWorkers', System.getProperty('worldgennext.prototype.cpuWorkers', '2')
    systemProperty 'worldgennext.prototype.cpuLiveTimeoutMillis', System.getProperty('worldgennext.prototype.cpuLiveTimeoutMillis', '120000')
    systemProperty 'worldgennext.candidate.requireLiveNoise', System.getProperty('worldgennext.candidate.requireLiveNoise', 'true')
    systemProperty 'worldgennext.candidate.timeoutMillis', System.getProperty('worldgennext.candidate.timeoutMillis', '180000')
    systemProperty 'worldgennext.candidate.liveNoiseResultDir', System.getProperty('worldgennext.candidate.liveNoiseResultDir', '')
    systemProperty 'worldgennext.candidate.cpuWorkers', System.getProperty('worldgennext.candidate.cpuWorkers', '2')
