tasks.register('candidateSmoke') {
    group = 'verification'
    description = 'Run the opt-in real-server CPU candidate capture into the versioned chunk-result ABI.'
    dependsOn tasks.named('runServer')
    doLast {
        if (!Boolean.parseBoolean(System.getProperty('worldgennext.candidate.capture', 'false'))) return
        def output = System.getProperty('worldgennext.candidate.output', '').trim()
        def caseFile = System.getProperty('worldgennext.candidate.caseFile', '').trim()
        if (output.isEmpty() && caseFile.isEmpty()) throw new GradleException('Candidate capture requires -Dworldgennext.candidate.output=<path> or -Dworldgennext.candidate.caseFile=<path>')
        if (!caseFile.isEmpty()) {
            def manifest = project.file(caseFile)
            if (!manifest.isFile() || manifest.length() == 0L) throw new GradleException("Candidate case manifest is missing or empty: ${manifest}")
            manifest.readLines('UTF-8').findAll { !it.trim().isEmpty() }.eachWithIndex { line, index ->
                def fields = line.split('\\t', -1)
                if (fields.size() != 3) throw new GradleException("Malformed candidate case manifest line ${index + 1}")
                def artifact = project.file(fields[2])
                if (!artifact.isFile() || artifact.length() == 0L) throw new GradleException("Candidate server exited without a result artifact: ${artifact}")
            }
        } else {
            def artifact = project.file(output)
            if (!artifact.isFile() || artifact.length() == 0L) throw new GradleException("Candidate server exited without a result artifact: ${artifact}")
        }
    }
}

tasks.register('candidateLogicalSmoke') {
    group = 'verification'
     description = 'Run the opt-in real-server candidate through the NOISE, FULL, or SAVED logical endpoint.'
    dependsOn tasks.named('runServer')
    doLast {
        if (!Boolean.parseBoolean(System.getProperty('worldgennext.candidate.capture', 'false'))) return
        def endpoint = System.getProperty('worldgennext.candidate.endpoint', '').trim().toUpperCase(Locale.ROOT)
        if (!(endpoint in ['NOISE', 'SURFACE', 'CARVERS', 'FEATURES', 'INITIALIZE_LIGHT', 'LIGHT', 'SPAWN', 'FULL', 'SAVED'])) throw new GradleException("Candidate logical smoke requires a supported logical endpoint, got ${endpoint}")
        def output = System.getProperty('worldgennext.candidate.output', '').trim()
        def caseFile = System.getProperty('worldgennext.candidate.caseFile', '').trim()
        if (output.isEmpty() && caseFile.isEmpty()) throw new GradleException('Candidate logical smoke requires -Dworldgennext.candidate.output=<path> or -Dworldgennext.candidate.caseFile=<path>')
        def artifacts = []
        if (!caseFile.isEmpty()) {
            def manifest = project.file(caseFile)
            if (!manifest.isFile() || manifest.length() == 0L) throw new GradleException("Candidate case manifest is missing or empty: ${manifest}")
            manifest.readLines('UTF-8').findAll { !it.trim().isEmpty() }.eachWithIndex { line, index ->
                def fields = line.split('\\t', -1)
                if (fields.size() != 3 || fields[2].trim().isEmpty()) throw new GradleException("Malformed candidate case manifest line ${index + 1}")
                artifacts << project.file(fields[2])
            }
        } else {
            artifacts << project.file(output)
        }
        artifacts.each { artifact ->
            if (!artifact.isFile() || artifact.length() == 0L) throw new GradleException("Candidate ${endpoint} server exited without a snapshot artifact: ${artifact}")
            if (artifact.withReader('UTF-8') { it.readLine() } != 'WORLDGENNEXT-SNAPSHOT-1') throw new GradleException("Candidate ${endpoint} artifact has an invalid header: ${artifact}")
            def status = project.file(artifact.absolutePath + '.candidate-status')
            if (!status.isFile() || status.withReader('UTF-8') { it.readLine() } != 'PASS') {
                throw new GradleException("Candidate ${endpoint} did not produce a PASS endpoint status: ${status}")
            }
        }
    }
}

tasks.register('gpuCandidateSmoke') {
    group = 'verification'
    description = 'Run the opt-in isolated real-device GPU NOISE replay; it never installs a live hook.'
    dependsOn tasks.named('runServer')
    doLast {
        def expectedStatus = Boolean.parseBoolean(System.getProperty('worldgennext.gpuCandidate.deviceOnly', 'false')) ? 'DEVICE_EXECUTION_ONLY' : 'PASS'
        if (!Boolean.parseBoolean(System.getProperty('worldgennext.gpuCandidate.capture', 'false'))) {
            throw new GradleException('GPU candidate smoke requires -Dworldgennext.gpuCandidate.capture=true')
        }
        def output = System.getProperty('worldgennext.candidate.output', '').trim()
        def caseFile = System.getProperty('worldgennext.candidate.caseFile', '').trim()
        if (output.isEmpty() && caseFile.isEmpty()) throw new GradleException('GPU candidate smoke requires -Dworldgennext.candidate.output=<path> or -Dworldgennext.candidate.caseFile=<path>')
        if (!caseFile.isEmpty()) {
            def manifest = project.file(caseFile)
            if (!manifest.isFile() || manifest.length() == 0L) throw new GradleException("GPU candidate case manifest is missing or empty: ${manifest}")
            manifest.readLines('UTF-8').findAll { !it.trim().isEmpty() }.eachWithIndex { line, index ->
                def fields = line.split('\\t', -1)
                if (fields.size() != 3) throw new GradleException("Malformed GPU candidate case manifest line ${index + 1}")
                def artifact = project.file(fields[2])
                if (!artifact.isFile() || artifact.length() == 0L) throw new GradleException("GPU candidate server exited without a result artifact: ${artifact}")
                def receipt = project.file(fields[2] + '.gpu-receipt.json')
                if (!receipt.isFile() || receipt.length() == 0L) throw new GradleException("GPU candidate server exited without a receipt: ${receipt}")
                def status = project.file(fields[2] + '.candidate-status')
                if (!status.isFile() || status.withReader('UTF-8') { it.readLine() } != expectedStatus) throw new GradleException("GPU candidate did not produce ${expectedStatus}: ${status}")
            }
        } else {
            def artifact = project.file(output)
            if (!artifact.isFile() || artifact.length() == 0L) throw new GradleException("GPU candidate server exited without a result artifact: ${artifact}")
            def status = project.file(output + '.candidate-status')
            if (!status.isFile() || status.withReader('UTF-8') { it.readLine() } != expectedStatus) throw new GradleException("GPU candidate did not produce ${expectedStatus}: ${status}")
        }
    }
}

// ---- Bundled GPU runtime -------------------------------------------------
// The Vulkan runtime and its LWJGL bindings/natives are nested as plain jars
// (not jar-in-jar modules) and loaded by GpuRuntimeLoader in an isolated class
// loader, so they cannot clash with a client's own LWJGL and are present on a
// dedicated server that has none.
configurations { gpuRuntime { transitive = false } }
dependencies {
    gpuRuntime 'org.lwjgl:lwjgl:3.3.3'
    gpuRuntime 'org.lwjgl:lwjgl-vulkan:3.3.3'
    gpuRuntime 'org.lwjgl:lwjgl-shaderc:3.3.3'
    gpuRuntime 'org.lwjgl:lwjgl:3.3.3:natives-windows'
    gpuRuntime 'org.lwjgl:lwjgl-shaderc:3.3.3:natives-windows'
    gpuRuntime 'org.lwjgl:lwjgl:3.3.3:natives-linux'
    gpuRuntime 'org.lwjgl:lwjgl-shaderc:3.3.3:natives-linux'
}
def gpuRuntimeDir = layout.buildDirectory.dir('generated/gpuRuntime')
tasks.register('stageGpuRuntime', Sync) {
    def runtimeJar = project(':runtime-vulkan').tasks.named('jar')
    dependsOn runtimeJar
    from(configurations.gpuRuntime)
    from(runtimeJar)
    into gpuRuntimeDir.map { it.dir('META-INF/worldgennext-gpu') }
    doLast {
        def directory = gpuRuntimeDir.get().dir('META-INF/worldgennext-gpu').asFile
        def names = directory.listFiles().findAll { it.name.endsWith('.jar') }.collect { it.name }.sort()
        new File(directory, 'index.txt').text = names.join('\n') + '\n'
    }
}
sourceSets.main.resources.srcDir(gpuRuntimeDir)
tasks.named('processResources') { dependsOn 'stageGpuRuntime' }
tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn 'stageGpuRuntime'; exclude 'META-INF/worldgennext-gpu/**' }
