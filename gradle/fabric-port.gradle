// A Fabric build of the mod for one Minecraft version, applied by that version's module after it has set
//   ext.portMinecraft   the Minecraft version
//   ext.portFabricApi   the Fabric API version
//   ext.portParents     modules of earlier versions whose files this one also uses, nearest first (optional)
//   ext.portRenames     plain renames in Minecraft, applied to a copy of the shared source (optional; see below)
//   ext.portFabricModules  the Fabric API modules to compile against instead of all of Fabric API (optional)
// The mod's code is the 1.21.1 source in the NeoForge module and the Fabric glue in fabric-1211.  A version's
// module holds only what that version needs differently, and so do its parents:
//   src/main/java       files that replace the shared file of the same path
//   removed.txt         shared files that have no counterpart (one path per line, under dev/worldgennext/neoforge/)
//   src/main/resources  files that replace the shared resource of the same path (mixin list, tested generators)
// Where several of them have a file, the module's own wins, then the nearest parent's.
def pureModules = ['semantic-core', 'compiler-jvm', 'compiler-vulkan', 'material-codec', 'spatial-data', 'chunk-engine', 'frontend-mc1211', 'runtime-vulkan']
def shared = project(':neoforge-1211').projectDir
def fabricGlue = project(':fabric-1211').projectDir
def layers = [projectDir] + (project.findProperty('portParents') ?: []).collect { project(":$it").projectDir }
def removed = layers.collectMany { layer ->
    def list = new File(layer, 'removed.txt')
    list.isFile() ? list.readLines('UTF-8').collect { it.trim() }.findAll { it && !it.startsWith('#') }.collect { 'dev/worldgennext/neoforge/' + it } : []
}
// The index of the layer a file belongs to, or -1 for the shared source and the Fabric glue.
def layerOf = { File file -> layers.findIndexOf { file.toPath().startsWith(it.toPath()) } }
// Whether a layer before the given one (all of them for -1) has this path under the given directory.
def replacedBefore = { int layer, String directory, String path ->
    (layer < 0 ? layers : layers.take(layer)).any { new File(new File(it, directory), path).isFile() }
}

dependencies {
    minecraft "com.mojang:minecraft:${portMinecraft}"
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    // portFabricModules: only these modules of Fabric API instead of all of it (for a Fabric API release
    // whose other modules this Loom cannot set up).
    def fabricModules = project.findProperty('portFabricModules')
    if (fabricModules) fabricModules.each { modImplementation fabricApi.module(it, portFabricApi) }
    else modImplementation "net.fabricmc.fabric-api:fabric-api:${portFabricApi}"
    implementation project(':compiler-vulkan')
}

// Which Java files of the shared source, the Fabric glue and the parents are left out.
def leftOut = { element ->
    if (element.isDirectory()) return false
    int layer = layerOf(element.file)
    if (layer < 0 && element.file.toPath().startsWith(shared.toPath())
            && element.path in ['dev/worldgennext/neoforge/loader/Loader.java', 'dev/worldgennext/neoforge/loader/NeoForgeEntry.java']) return true
    return (layer < 0 && element.path in removed) || replacedBefore(layer, 'src/main/java', element.path)
}
// portRenames: Minecraft names that changed without anything else changing (a class renamed or moved, a
// method renamed), as regular expression -> replacement.  They are applied line by line to a copy of every
// file that is not this module's own, and the copy is what is compiled; lines keep their numbers.
def renames = project.findProperty('portRenames') ?: [:]
def portSources = layout.buildDirectory.dir('portSources/java')
if (renames) {
    tasks.register('assemblePortSources', Sync) {
        from new File(shared, 'src/main/java')
        from new File(fabricGlue, 'src/main/java')
        layers.drop(1).each { from new File(it, 'src/main/java') }
        exclude leftOut
        filteringCharset = 'UTF-8'
        filter { String line -> renames.inject(line) { text, entry -> text.replaceAll(entry.key, entry.value) } }
        inputs.property 'renames', renames.toString()
        into portSources
    }
}
sourceSets.main {
    java {
        if (renames) {
            srcDir tasks.named('assemblePortSources')
        } else {
            srcDir new File(shared, 'src/main/java')
            srcDir new File(fabricGlue, 'src/main/java')
            layers.drop(1).each { srcDir new File(it, 'src/main/java') }
            exclude leftOut
        }
    }
    resources {
        srcDir new File(shared, 'src/main/resources')
        srcDir new File(fabricGlue, 'src/main/resources')
        layers.drop(1).each { srcDir new File(it, 'src/main/resources') }
        exclude { element ->
            if (element.isDirectory()) return false
            int layer = layerOf(element.file)
            return (layer < 0 && element.path == 'META-INF/neoforge.mods.toml') || replacedBefore(layer, 'src/main/resources', element.path)
        }
    }
}

tasks.named('processResources') {
    inputs.property 'version', project.version
    inputs.property 'minecraft', portMinecraft
    filesMatching('fabric.mod.json') { expand version: project.version, minecraft: portMinecraft }
}

tasks.named('jar', Jar) {
    pureModules.each { from project(":$it").sourceSets.main.output }
    duplicatesStrategy = DuplicatesStrategy.FAIL
}
tasks.named('sourcesJar', Jar) {
    pureModules.each { from project(":$it").sourceSets.main.allSource }
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

loom {
    accessWidenerPath = new File(fabricGlue, 'src/main/resources/worldgennext.accesswidener')
    runs {
        configureEach {
            // Same switches as the NeoForge dev runs: every -Dworldgennext.* given to Gradle reaches the game.
            System.properties.each { key, value ->
                if (key.toString().startsWith('worldgennext.') && !(key.toString() in ['worldgennext.candidate.runDir', 'worldgennext.run.maxHeap', 'worldgennext.run.jvmArgs'])) {
                    // Relative output paths are resolved here: the game's working directory is the run directory.
                    property key.toString(), key == 'worldgennext.bench.output' && !value.toString().trim().isEmpty() ? project.file(value.toString().trim()).absolutePath : value.toString()
                }
            }
            def maxHeap = System.getProperty('worldgennext.run.maxHeap', '').trim()
            if (!maxHeap.isEmpty()) vmArg "-Xmx${maxHeap}"
            vmArg '-Dorg.lwjgl.system.stackSize=16384'
            def directory = System.getProperty('worldgennext.candidate.runDir', '').trim()
            if (!directory.isEmpty()) runDir = project.projectDir.toPath().relativize(new File(directory).toPath()).toString().replace(File.separator, '/')
        }
        server { programArg 'nogui' }
        client {
            // Straight into an existing singleplayer world (a folder under <run directory>/saves).
            def quickPlay = System.getProperty('worldgennext.client.quickPlay', '').trim()
            if (!quickPlay.isEmpty()) programArgs '--quickPlaySingleplayer', quickPlay
        }
    }
}

apply from: rootProject.file('gradle/gpu-runtime.gradle')

// ---- Names for a released game -----------------------------------------------
// The mod reads parts of the world generator by reflection, by the names its source uses.  A released Fabric
// game runs with other ("intermediary") names.  This writes the pairs for the names that occur as string
// literals in the mod's source, and only those, from the mappings this build uses; loader/Loader reads it.
def nameTableDir = layout.buildDirectory.dir('generated/nameTable')
tasks.register('generateNameTable') {
    // With renames the copy is read, so that a renamed class is looked up under its new name.
    def sources = renames ? fileTree(portSources) { include '**/*.java' } + fileTree('src/main/java') { include '**/*.java' }
            : fileTree(new File(shared, 'src/main/java')) { include '**/*.java' } + fileTree(new File(fabricGlue, 'src/main/java')) { include '**/*.java' } + layers.collect { fileTree(new File(it, 'src/main/java')) { include '**/*.java' } }.sum()
    if (renames) dependsOn 'assemblePortSources'
    inputs.files(sources)
    outputs.dir(nameTableDir)
    doLast {
        def tokens = new HashSet<String>()
        sources.each { source -> (source.getText('UTF-8') =~ /"([A-Za-z_$][A-Za-z0-9_$]*)"/).each { tokens.add(it[1]) } }
        def mappings = loom.mappingConfiguration.tinyMappings.toFile()
        def header = mappings.withReader('UTF-8') { it.readLine() }.split('\t')
        def intermediary = header.findIndexOf { it == 'intermediary' } - 3
        def named = header.findIndexOf { it == 'named' } - 3
        if (header[0] != 'tiny' || intermediary < 0 || named < 0) throw new GradleException("Unexpected mappings header in ${mappings}")
        def table = new StringBuilder()
        String classRuntime = null
        boolean minecraft = false
        mappings.eachLine('UTF-8') { line ->
            def part = line.split('\t', -1)
            if (part[0] == 'c') {
                classRuntime = part[1 + intermediary]
                def source = part[1 + named]
                minecraft = source.startsWith('net/minecraft/') || source.startsWith('com/mojang/')
                def simple = source.substring(Math.max(source.lastIndexOf('/'), source.lastIndexOf('$')) + 1)
                if (minecraft && tokens.contains(simple)) table << "c\t${classRuntime}\t${source}\n"
            } else if (minecraft && part.length >= 5 && part[0] == '' && (part[1] == 'f' || part[1] == 'm')) {
                def runtime = part[3 + intermediary], source = part[3 + named]
                if (runtime != source && tokens.contains(source)) table << "${part[1]}\t${classRuntime}\t${source}\t${runtime}\n"
            }
        }
        def file = nameTableDir.get().file('worldgennext/fabric-names.tsv').asFile
        file.parentFile.mkdirs()
        file.setText(table.toString(), 'UTF-8')
    }
}
sourceSets.main.resources.srcDir(nameTableDir)
tasks.named('processResources') { dependsOn 'generateNameTable' }
tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn 'generateNameTable'; exclude 'worldgennext/fabric-names.tsv' }

// The dev server's run directory, as in the NeoForge module (scripts/run-pregen.sh, bench-cps.ps1).
tasks.register('prepareCandidateRun') {
    doLast {
        def directory = project.file(System.getProperty('worldgennext.candidate.runDir', layout.buildDirectory.dir('run/candidate').get().asFile.absolutePath))
        if (Boolean.parseBoolean(System.getProperty('worldgennext.prototype.resume', 'false'))) return
        directory.mkdirs()
        new File(directory, 'eula.txt').text = 'eula=true\n'
        def seed = System.getProperty('worldgennext.candidate.seed', '0')
        new File(directory, 'server.properties').text = "level-seed=${seed}\nlevel-name=candidate-world\ngenerate-structures=${System.getProperty('worldgennext.run.generateStructures', 'true')}\nsync-chunk-writes=${System.getProperty('worldgennext.run.syncChunkWrites', 'true')}\nonline-mode=false\nserver-ip=127.0.0.1\nserver-port=${System.getProperty('worldgennext.prototype.port', '25565')}\nspawn-protection=0\nmax-tick-time=-1\nenable-command-block=true\n"
    }
}
tasks.matching { it.name == 'runServer' || it.name == 'runClient' }.configureEach { dependsOn tasks.named('prepareCandidateRun') }
