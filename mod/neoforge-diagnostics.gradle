// What only the NeoForge 1.21.1 build has: the GameTest source set and server, the defaults of the early
// candidate/replay diagnostics, and their tasks.  Applied by mod/neoforge.gradle for the target marked
// diagnostics in mod/targets.gradle; scripts/replay-*.ps1 and capture-*.ps1 use these.
def pureModules = ['semantic-core', 'compiler-jvm', 'compiler-vulkan', 'material-codec', 'spatial-data', 'chunk-engine', 'frontend-mc1211', 'runtime-vulkan']

sourceSets {
    gameTest {
        java.srcDirs = [rootProject.file('mod/common/src/gameTest/java')]
        resources.srcDirs = [rootProject.file('mod/common/src/gameTest/resources')]
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    test {
        java.srcDirs = [rootProject.file('mod/common/src/test/java')]
    }
}
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}
dependencies { pureModules.each { gameTestImplementation project(":$it") } }

neoForge {
    addModdingDependenciesTo(sourceSets.gameTest)
    mods {
        tellurium_test { sourceSet sourceSets.gameTest }
    }
    runs {
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            loadedMods = [mods.tellurium, mods.tellurium_test]
            gameDirectory = layout.buildDirectory.dir('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'tellurium_test'
            systemProperty 'neoforge.gameTestServer', 'true'
            programArguments.addAll '--world', 'tellurium-diagnostics'
        }
    }
}

tasks.register('gameSmoke') {
    group = 'verification'
    description = 'Opt-in real NeoForge bootstrap, mapped capture and direct-density diagnostic GameTests; no chunk/GPU parity claim.'
    dependsOn tasks.named('runGameTestServer')
}

